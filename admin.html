<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - الأدمن</title>
  <style>
    body { font-family: sans-serif; background: #222; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #333; padding: 20px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    textarea { width: 90%; height: 100px; margin: 15px 0; padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
    button { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #218838; }
  </style>
</head>
<body>

  <div class="box">
    <h2>لوحة إرسال الرسائل 🛠️</h2>
    <textarea id="adminInput" placeholder="اكتب رسالتك هنا..."></textarea><br>
    <button onclick="sendMessage()">نشر للجميع 🚀</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://chatity-2da63-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    function sendMessage() {
      const text = document.getElementById('adminInput').value;
      if(text.trim() === "") return alert("اكتب رسالة أولاً!");

      firebase.database().ref('liveMessage').set({
        msg: text,
        time: new Date().toLocaleTimeString('ar-EG')
      })
      .then(() => {
        alert("!تم نشر الرسالة للجميع بنجاح");
        document.getElementById('adminInput').value = "";
      })
      .catch((error) => {
        alert("حدث خطأ: " + error.message);
      });
    }
  </script>

</body>
</html>
