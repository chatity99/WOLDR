<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatity Super App</title>
  <style>
    :root { --primary: #075e54; --secondary: #128c7e; --bg: #efeae2; --blue-msg: #0078fe; --accent: #fe2c55; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: #fff; display: flex; flex-direction: column; height: 100%; position: relative; }
    
    .header { background: var(--primary); color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .notif-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; position: relative; }
    .notif-badge { position: absolute; top: -2px; right: -2px; background: red; color: white; border-radius: 50%; font-size: 10px; padding: 1px 4px; }

    .nav-tabs { display: flex; background: var(--secondary); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #fff; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 12px; }
    .tab-btn.active { border-bottom: 3px solid #fff; background: rgba(255,255,255,0.15); }

    .content-area { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: #fff; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 14px; position: relative; }
    .msg.me { margin-right: auto; background: #dcf8c6; }
    .msg.system-blue { background: var(--blue-msg) !important; color: #fff !important; width: 92% !important; margin: 6px auto !important; border-radius: 10px; text-align: center; font-weight: bold; }
    
    .msg-header { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #555; }
    .avatar-mini { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    .verified-badge { background: #1da1f2; color: #fff; border-radius: 50%; padding: 0 4px; font-size: 9px; }
    .msg img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 5px; display: block; }

    .input-area { padding: 8px; background: #f0f0f0; display: flex; gap: 6px; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
    .btn-send { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; }

    /* TikTok Profile & Cards */
    .profile-card { display: flex; flex-direction: column; align-items: center; padding: 15px; background: #fff; border-radius: 12px; }
    .profile-avatar-wrap { position: relative; width: 85px; height: 85px; margin-bottom: 8px; }
    .profile-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; }
    .avatar-edit-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; opacity: 0; transition: 0.2s; cursor: pointer; }
    .profile-avatar-wrap:hover .avatar-edit-overlay { opacity: 1; }

    .profile-stats { display: flex; gap: 20px; margin: 12px 0; text-align: center; }
    .stat-box span { display: block; font-weight: bold; font-size: 15px; }
    .stat-box label { font-size: 11px; color: #666; }
    
    .btn-action-main { background: #fff; border: 1px solid #ccc; padding: 7px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-action-main.follow { background: var(--accent); color: #fff; border: none; }
    .btn-action-main.unfollow { background: #e0e0e0; color: #333; border: none; }

    .user-item { background: #fff; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

    .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 99; }
    .modal-body { background: #fff; padding: 18px; border-radius: 12px; width: 88%; max-width: 340px; text-align: center; max-height: 85vh; overflow-y: auto; }
    .btn-full { width: 100%; padding: 8px; margin-top: 6px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .form-input { width: 100%; padding: 8px 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, set, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJi3vI17B3pI7KF3c8CemUL0EB8s0XCDg",
      authDomain: "chatity-2da63.firebaseapp.com",
      databaseURL: "https://chatity-2da63-default-rtdb.firebaseio.com",
      projectId: "chatity-2da63",
      storageBucket: "chatity-2da63.firebasestorage.app",
      messagingSenderId: "68253755871",
      appId: "1:68253755871:web:5da50607c18b9b0218bc6a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let userData = {};
    let currentTab = "public";
    let activeDM = null;
    let mediaRecorder = null;
    let audioChunks = [];

    window.loginWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        
        onValue(ref(db, 'users/' + user.uid), (snapshot) => {
          userData = snapshot.val() || {};
          if (!snapshot.exists()) {
            const baseUser = user.email.split('@')[0];
            userData = { 
              name: user.displayName || 'مستخدم', 
              username: baseUser, 
              photo: user.photoURL || 'https://via.placeholder.com/85', 
              role: 'user', 
              verified: false, 
              bio: 'أهلاً بك في حسابي!',
              followersCount: 0,
              followingCount: 0,
              nameChanges: [],
              usernameChanges: []
            };
            set(ref(db, 'users/' + user.uid), userData);
          }
          document.getElementById('user-header-info').innerText = `${userData.name} [${userData.role}]`;
          document.getElementById('blue-option').style.display = (userData.role === 'founder') ? 'flex' : 'none';
        });

        listenNotifications();
        switchTab('public');
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
      }
    });

    window.switchTab = (tab, dmUid = null) => {
      currentTab = tab;
      activeDM = dmUid;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');
      
      const inputArea = document.getElementById('input-area');
      const isAnnouncementsUser = (tab === 'announcements' && userData.role !== 'founder');
      inputArea.style.display = (tab === 'search' || tab === 'profile' || tab === 'inbox' || isAnnouncementsUser) ? 'none' : 'flex';

      if (tab === 'search') renderSearch();
      else if (tab === 'profile') renderProfile(currentUser.uid);
      else if (tab === 'inbox') renderInbox();
      else if (tab === 'dm') loadDMMessages(dmUid);
      else loadMessages(tab);
    };

    // Helper: File to Base64 (Reliable Image Upload)
    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    window.uploadImage = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const base64 = await fileToBase64(file);
        postMessage({ image: base64 });
      } catch (err) { alert('خطأ في تحميل الصورة'); }
    };

    window.toggleRecord = async () => {
      const recBtn = document.getElementById('rec-btn');
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => postMessage({ audio: reader.result });
          };
          mediaRecorder.start();
          recBtn.innerText = '🔴';
        } catch(e) { alert('يرجى السماح بالوصول للمايكروفون'); }
      } else {
        mediaRecorder.stop();
        recBtn.innerText = '🎙️';
      }
    };

    window.sendMessage = () => {
      const input = document.getElementById('msg-input');
      if (!input.value.trim()) return;
      postMessage({ text: input.value });
      input.value = '';
    };

    async function postMessage(content) {
      if (currentTab === 'dm') {
        const isBlocked = await checkBlockStatus(activeDM, currentUser.uid);
        if (isBlocked) { alert('لقد حظرك هذا المستخدم، لا يمكنك مراسلته!'); return; }
      }

      const isBlue = document.getElementById('blue-msg-check')?.checked && userData.role === 'founder';
      const msgData = {
        senderUid: isBlue ? 'system' : currentUser.uid,
        senderName: isBlue ? '' : userData.name,
        photo: isBlue ? '' : userData.photo,
        isVerified: isBlue ? false : !!userData.verified,
        role: isBlue ? '' : userData.role,
        isSystemBlue: isBlue,
        timestamp: Date.now(),
        ...content
      };

      if (currentTab === 'dm') {
        const chatKey = [currentUser.uid, activeDM].sort().join('_');
        push(ref(db, `direct_messages/${chatKey}`), msgData);
        // Save to Inbox list for both users
        set(ref(db, `inbox/${currentUser.uid}/${activeDM}`), { lastUpdated: Date.now() });
        set(ref(db, `inbox/${activeDM}/${currentUser.uid}`), { lastUpdated: Date.now() });
      } else {
        push(ref(db, `messages/${currentTab}`), msgData);
        if (currentTab === 'announcements') {
          // Notify users about new announcement
          push(ref(db, 'global_notifications'), { text: '📢 إعلان جديد من الفاوندر!', timestamp: Date.now() });
        }
      }
    }

    function loadMessages(tab) {
      onValue(ref(db, `messages/${tab}`), snapshot => renderMessageList(snapshot));
    }

    function loadDMMessages(targetUid) {
      const chatKey = [currentUser.uid, targetUid].sort().join('_');
      onValue(ref(db, `direct_messages/${chatKey}`), snapshot => renderMessageList(snapshot));
    }

    function renderMessageList(snapshot) {
      const box = document.getElementById('content-box');
      box.innerHTML = '';
      snapshot.forEach((child) => {
        const m = child.val();
        const key = child.key;
        const div = document.createElement('div');
        
        if (m.isSystemBlue) {
          div.className = 'msg system-blue';
          div.innerText = m.text;
        } else {
          const isMyMsg = m.senderUid === currentUser.uid;
          div.className = `msg ${isMyMsg ? 'me' : ''}`;
          
          let deleteBtn = '';
          if (isMyMsg || userData.role === 'founder' || (userData.role === 'helper' && m.role === 'user')) {
            deleteBtn = `<span onclick="deleteMsg('${key}')" style="color:red;cursor:pointer;margin-right:6px;" title="حذف">🗑️</span>`;
          }

          div.innerHTML = `
            <div class="msg-header">
              <img src="${m.photo || 'https://via.placeholder.com/24'}" class="avatar-mini">
              <span onclick="renderProfile('${m.senderUid}')" style="cursor:pointer">${m.senderName}</span>
              ${m.isVerified ? '<span class="verified-badge">✓</span>' : ''}
              ${deleteBtn}
            </div>
            ${m.text ? `<div>${m.text}</div>` : ''}
            ${m.image ? `<img src="${m.image}">` : ''}
            ${m.audio ? `<audio controls src="${m.audio}" style="max-width:200px;margin-top:4px;"></audio>` : ''}
          `;
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    window.deleteMsg = (key) => {
      const path = currentTab === 'dm' ? `direct_messages/${[currentUser.uid, activeDM].sort().join('_')}/${key}` : `messages/${currentTab}/${key}`;
      remove(ref(db, path));
    };

    // Inbox Tab
    function renderInbox() {
      const box = document.getElementById('content-box');
      box.innerHTML = '<h3>محادثاتي الخاصة 💬</h3>';
      onValue(ref(db, `inbox/${currentUser.uid}`), async (snapshot) => {
        if (!snapshot.exists()) { box.innerHTML += '<p style="color:#777;margin-top:10px;">لا توجد محادثات سابقة.</p>'; return; }
        snapshot.forEach(async (child) => {
          const targetUid = child.key;
          const uSnap = await get(ref(db, 'users/' + targetUid));
          if (uSnap.exists()) {
            const u = uSnap.val();
            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerHTML = `
              <div style="display:flex;align-items:center;gap:10px;">
                <img src="${u.photo || 'https://via.placeholder.com/35'}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
                <div>
                  <b>${u.name}</b> ${u.verified ? '✅' : ''}<br>
                  <small style="color:#777;">@${u.username}</small>
                </div>
              </div>
              <button class="btn-action-main" onclick="switchTab('dm', '${targetUid}')">فتح الشات</button>
            `;
            box.appendChild(div);
          }
        });
      }, { onlyOnce: true });
    }

    // Profile Screen
    window.renderProfile = async (targetUid) => {
      const isSelf = targetUid === currentUser.uid;
      const box = document.getElementById('content-box');

      const isBlockedByMe = await checkBlockStatus(currentUser.uid, targetUid);
      const isBlockedMe = await checkBlockStatus(targetUid, currentUser.uid);

      if (isBlockedMe && !isSelf) {
        box.innerHTML = `<div class="profile-card"><p style="color:red;font-weight:bold;">لقد حظرك هذا المستخدم!</p></div>`;
        return;
      }

      onValue(ref(db, 'users/' + targetUid), async (snapshot) => {
        const u = snapshot.val() || {};
        const isFollowing = await checkFollowStatus(targetUid);
        const amIFollowed = await checkFollowStatus(currentUser.uid, targetUid); // Check if they follow me

        let followBtnText = isFollowing ? 'إلغاء المتابعة' : (amIFollowed ? 'رد المتابعة' : 'متابعة');
        let followBtnClass = isFollowing ? 'unfollow' : 'follow';

        box.innerHTML = `
          <div class="profile-card">
            <div class="profile-avatar-wrap" onclick="${isSelf ? "document.getElementById('avatar-file').click()" : ""}">
              <img src="${u.photo || 'https://via.placeholder.com/85'}" class="profile-avatar">
              ${isSelf ? '<div class="avatar-edit-overlay">📷</div>' : ''}
            </div>
            <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
            
            <h3 style="display:flex;align-items:center;gap:4px;">
              ${u.name} ${u.verified ? '<span class="verified-badge">✓</span>' : ''}
            </h3>
            <span style="color:#777;font-size:12px;">@${u.username}</span>
            
            <div class="profile-stats">
              <div class="stat-box"><span>${u.followingCount || 0}</span><label>أتابعهم</label></div>
              <div class="stat-box"><span>${u.followersCount || 0}</span><label>متابعون</label></div>
            </div>

            <p style="font-size:13px;color:#444;margin-bottom:12px;text-align:center;">${u.bio || 'لا يوجد وصف'}</p>

            ${isSelf ? `
              <button class="btn-action-main" onclick="openEditModal()">تعديل الملف الشخصي (Edit)</button>
            ` : `
              <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
                <button class="btn-action-main ${followBtnClass}" onclick="toggleFollow('${targetUid}')">${followBtnText}</button>
                <button class="btn-action-main" onclick="switchTab('dm', '${targetUid}')">مراسلة خاصة 💬</button>
                <button class="btn-action-main" style="color:red;" onclick="toggleBlock('${targetUid}', ${!isBlockedByMe})">${isBlockedByMe ? 'إلغاء الحظر' : 'حظر 🚫'}</button>
              </div>
            `}

            ${userData.role === 'founder' && !isSelf ? `
              <div style="margin-top:15px;width:100%;border-top:1px solid #eee;padding-top:10px;">
                <p style="font-size:12px;font-weight:bold;color:red;">لوحة إدارية (Founder):</p>
                <button class="btn-full" style="background:#2196F3;color:#fff;" onclick="toggleVerify('${targetUid}', ${!u.verified})">${u.verified ? 'إزالة التوثيق' : 'منح التوثيق ✅'}</button>
                <button class="btn-full" style="background:#ff9800;color:#fff;" onclick="setRole('${targetUid}', 'helper')">تعيين Helper</button>
                <button class="btn-full" style="background:#f44336;color:#fff;" onclick="setRole('${targetUid}', 'user')">تنزيل إلى User</button>
              </div>
            ` : ''}
          </div>
        `;
      });
    };

    window.uploadAvatar = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const base64 = await fileToBase64(file);
        update(ref(db, 'users/' + currentUser.uid), { photo: base64 });
      } catch(err) { alert('فشل تغيير صورة الملف الشخصي'); }
    };

    // Follow System Logic
    async function checkFollowStatus(targetUid, sourceUid = currentUser.uid) {
      const snap = await get(ref(db, `follows/${sourceUid}/${targetUid}`));
      return snap.exists();
    }

    window.toggleFollow = async (targetUid) => {
      const isFollowing = await checkFollowStatus(targetUid);
      const myRef = ref(db, 'users/' + currentUser.uid);
      const targetRef = ref(db, 'users/' + targetUid);

      const mySnap = await get(myRef);
      const targetSnap = await get(targetRef);
      let myData = mySnap.val();
      let targetData = targetSnap.val();

      if (isFollowing) {
        remove(ref(db, `follows/${currentUser.uid}/${targetUid}`));
        update(myRef, { followingCount: Math.max(0, (myData.followingCount || 0) - 1) });
        update(targetRef, { followersCount: Math.max(0, (targetData.followersCount || 0) - 1) });
      } else {
        set(ref(db, `follows/${currentUser.uid}/${targetUid}`), true);
        update(myRef, { followingCount: (myData.followingCount || 0) + 1 });
        update(targetRef, { followersCount: (targetData.followersCount || 0) + 1 });
        
        // Notification
        push(ref(db, `notifications/${targetUid}`), {
          type: 'follow',
          fromUid: currentUser.uid,
          fromName: userData.name,
          timestamp: Date.now()
        });
      }
      renderProfile(targetUid);
    };

    // Block Logic
    async function checkBlockStatus(blockerUid, blockedUid) {
      const snap = await get(ref(db, `blocks/${blockerUid}/${blockedUid}`));
      return snap.exists();
    }

    window.toggleBlock = (targetUid, status) => {
      if (status) {
        set(ref(db, `blocks/${currentUser.uid}/${targetUid}`), true);
        alert('تم حظر المستخدم');
      } else {
        remove(ref(db, `blocks/${currentUser.uid}/${targetUid}`));
        alert('تم إلغاء الحظر');
      }
      renderProfile(targetUid);
    };

    // Notifications
    function listenNotifications() {
      onValue(ref(db, `notifications/${currentUser.uid}`), snapshot => {
        const badge = document.getElementById('notif-badge');
        if (snapshot.exists()) {
          badge.style.display = 'block';
          badge.innerText = snapshot.size;
        } else {
          badge.style.display = 'none';
        }
      });
    }

    window.openNotifications = () => {
      onValue(ref(db, `notifications/${currentUser.uid}`), snapshot => {
        let content = '<h3>الإشعارات 🔔</h3>';
        if (!snapshot.exists()) { content += '<p>لا توجد إشعارات جديدة.</p>'; }
        snapshot.forEach(c => {
          const n = c.val();
          content += `
            <div style="background:#f0f0f0;padding:8px;border-radius:6px;margin:6px 0;text-align:right;">
              قام <b>${n.fromName}</b> بمتابعتك!
              <button class="btn-full" style="background:var(--accent);color:#fff;" onclick="closeModal();renderProfile('${n.fromUid}')">عرض الحساب</button>
            </div>
          `;
        });
        content += '<button class="btn-full" onclick="closeModal()">إغلاق</button>';
        document.getElementById('modal-content').innerHTML = content;
        document.getElementById('modal').style.display = 'flex';
      }, { onlyOnce: true });
    };

    window.openEditModal = () => {
      document.getElementById('modal-content').innerHTML = `
        <h3>تعديل الملف الشخصي</h3>
        <input type="text" id="edit-name" class="form-input" value="${userData.name}" placeholder="الاسم الجديد">
        <input type="text" id="edit-username" class="form-input" value="${userData.username}" placeholder="اسم المستخدم (بدون @)">
        <textarea id="edit-bio" class="form-input" placeholder="الوصف (Bio)">${userData.bio || ''}</textarea>
        <button class="btn-full" style="background:var(--primary);color:#fff;" onclick="saveProfileChanges()">حفظ التعديلات</button>
        <button class="btn-full" onclick="closeModal()">إلغاء</button>
      `;
      document.getElementById('modal').style.display = 'flex';
    };

    window.saveProfileChanges = async () => {
      const newName = document.getElementById('edit-name').value.trim();
      let newUsername = document.getElementById('edit-username').value.trim().replace('@', '');
      const newBio = document.getElementById('edit-bio').value.trim();
      const now = Date.now();

      const validNameChanges = (userData.nameChanges || []).filter(t => now - t < 30 * 86400 * 1000);
      if (newName !== userData.name && validNameChanges.length >= 3) {
        alert('يمكنك تغيير الاسم 3 مرات فقط كل 30 يوم!'); return;
      }

      const validUsernameChanges = (userData.usernameChanges || []).filter(t => now - t < 7 * 86400 * 1000);
      if (newUsername !== userData.username && validUsernameChanges.length >= 2) {
        alert('يمكنك تغيير اسم المستخدم مرتين فقط كل 7 أيام!'); return;
      }

      if (newUsername !== userData.username) {
        const checkSnap = await get(ref(db, 'users'));
        let isTaken = false;
        checkSnap.forEach(c => { if (c.val().username === newUsername) isTaken = true; });
        if (isTaken) { alert('اسم المستخدم مستعمل بالفعل!'); return; }
      }

      if (newName !== userData.name) validNameChanges.push(now);
      if (newUsername !== userData.username) validUsernameChanges.push(now);

      update(ref(db, 'users/' + currentUser.uid), {
        name: newName, username: newUsername, bio: newBio,
        nameChanges: validNameChanges, usernameChanges: validUsernameChanges
      }).then(() => { closeModal(); renderProfile(currentUser.uid); });
    };

    function renderSearch() {
      const box = document.getElementById('content-box');
      box.innerHTML = `
        <input type="text" class="form-input" placeholder="ابحث بايميل أو يوزر..." oninput="executeSearch(this.value)">
        <div id="search-results" style="margin-top:10px;"></div>
      `;
    }

    window.executeSearch = (val) => {
      const res = document.getElementById('search-results');
      if (!val.trim()) { res.innerHTML = ''; return; }
      val = val.toLowerCase().replace('@', '');
      onValue(ref(db, 'users'), (snapshot) => {
        res.innerHTML = '';
        snapshot.forEach((child) => {
          const u = child.val();
          const uid = child.key;
          if (u.username?.toLowerCase().includes(val) || u.name?.toLowerCase().includes(val)) {
            res.innerHTML += `
              <div class="user-item">
                <div style="display:flex;align-items:center;gap:8px;">
                  <img src="${u.photo || 'https://via.placeholder.com/35'}" style="width:35px;height:35px;border-radius:50%;object-fit:cover;">
                  <div>
                    <b>${u.name}</b> ${u.verified ? '✅' : ''}<br>
                    <small style="color:#777;">@${u.username}</small>
                  </div>
                </div>
                <button class="btn-action-main" onclick="renderProfile('${uid}')">عرض الملف</button>
              </div>
            `;
          }
        });
      }, { onlyOnce: true });
    };

    window.toggleVerify = (uid, status) => { update(ref(db, 'users/' + uid), { verified: status }); closeModal(); };
    window.setRole = (uid, role) => { update(ref(db, 'users/' + uid), { role: role }); closeModal(); };
    window.closeModal = () => document.getElementById('modal').style.display = 'none';
  </script>
</head>
<body>

  <div id="login-screen" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;gap:15px;">
    <h2>Chatity App</h2>
    <button onclick="loginWithGoogle()" style="padding:10px 20px;background:#4285f4;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">دخول بواسطة Google</button>
  </div>

  <div id="app-screen" class="app-container" style="display:none;">
    <div class="header">
      <div class="header-left">
        <button class="notif-btn" onclick="openNotifications()">
          🔔 <span id="notif-badge" class="notif-badge" style="display:none;">0</span>
        </button>
        <span id="user-header-info">...</span>
      </div>
      <button onclick="logout()" style="background:#d32f2f;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;">خروج</button>
    </div>

    <div class="nav-tabs">
      <button id="tab-public" class="tab-btn active" onclick="switchTab('public')">العام</button>
      <button id="tab-announcements" class="tab-btn" onclick="switchTab('announcements')">الإشعارات 📢</button>
      <button id="tab-inbox" class="tab-btn" onclick="switchTab('inbox')">الرسائل 💬</button>
      <button id="tab-search" class="tab-btn" onclick="switchTab('search')">بحث 🔍</button>
      <button id="tab-profile" class="tab-btn" onclick="switchTab('profile')">حسابي 👤</button>
    </div>

    <div id="content-box" class="content-area"></div>

    <div id="input-area" class="input-area">
      <button class="icon-btn" onclick="document.getElementById('img-file').click()">📷</button>
      <input type="file" id="img-file" accept="image/*" style="display:none" onchange="uploadImage(event)">
      
      <button id="rec-btn" class="icon-btn" onclick="toggleRecord()">🎙️</button>

      <input type="text" id="msg-input" placeholder="اكتب رسالة...">
      
      <label id="blue-option" style="font-size:11px;display:none;align-items:center;gap:2px;">
        <input type="checkbox" id="blue-msg-check"> أزرق
      </label>

      <button class="btn-send" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <div id="modal" class="modal">
    <div id="modal-content" class="modal-body"></div>
  </div>

</body>
</html>
