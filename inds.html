<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M - تواصل اجتماعي</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Main App Container */
        .app-container {
            max-width: 430px;
            height: 100vh;
            margin: 0 auto;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Video Feed */
        .video-feed {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            height: 100vh;
            scrollbar-width: none;
        }

        .video-feed::-webkit-scrollbar {
            display: none;
        }

        /* Video Item */
        .video-item {
            position: relative;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: rgba(255,255,255,0.3);
            position: relative;
        }

        .video-placeholder .play-icon {
            font-size: 60px;
            color: rgba(255,255,255,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        /* Video Info Overlay */
        .video-overlay {
            position: absolute;
            bottom: 120px;
            left: 20px;
            right: 80px;
            z-index: 10;
        }

        .video-username {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-username .badge {
            background: #ff0050;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .video-description {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.4;
        }

        .video-description .hashtag {
            color: #00f2ea;
            margin-left: 5px;
        }

        /* Side Actions */
        .side-actions {
            position: absolute;
            bottom: 120px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.2s;
            background: none;
            border: none;
            color: #fff;
            font-size: 12px;
        }

        .action-btn:active {
            transform: scale(0.8);
        }

        .action-btn .icon {
            font-size: 32px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .action-btn .icon.liked {
            color: #ff0050;
            background: rgba(255, 0, 80, 0.3);
        }

        .action-btn .count {
            font-size: 12px;
            font-weight: 500;
        }

        .action-btn .profile-pic-small {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 10px 0 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            color: #888;
            transition: color 0.3s;
            background: none;
            border: none;
            font-size: 10px;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item .nav-icon {
            font-size: 26px;
        }

        .nav-item .nav-icon.add {
            font-size: 32px;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            border-radius: 50%;
            padding: 4px 12px;
            margin-top: -20px;
            color: #fff;
        }

        /* Top Header */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 40px 20px 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .header-actions button {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        /* Loading State */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            z-index: 1;
        }

        /* Comment Modal */
        .comment-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .comment-modal.open {
            transform: translateY(0);
        }

        .comment-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .comment-modal .modal-header h3 {
            font-size: 18px;
        }

        .comment-modal .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .comment-item .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .comment-item .comment-content {
            flex: 1;
        }

        .comment-item .comment-username {
            font-weight: 600;
            font-size: 14px;
        }

        .comment-item .comment-text {
            font-size: 14px;
            opacity: 0.9;
        }

        .comment-input-area {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .comment-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .comment-input-area input::placeholder {
            color: #888;
        }

        .comment-input-area button {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* Overlay for modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 99;
            display: none;
        }

        .modal-overlay.open {
            display: block;
        }

        /* Responsive for larger screens */
        @media (min-width: 431px) {
            .app-container {
                border-left: 1px solid rgba(255,255,255,0.1);
                border-right: 1px solid rgba(255,255,255,0.1);
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Header -->
    <div class="top-header">
        <div class="app-logo">M</div>
        <div class="header-actions">
            <button onclick="alert('قريباً...')">🔍</button>
            <button onclick="alert('قريباً...')">📸</button>
        </div>
    </div>

    <!-- Video Feed -->
    <div class="video-feed" id="videoFeed">
        <!-- Videos will be generated by JavaScript -->
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="navigateTo('home')">
            <span class="nav-icon">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="navigateTo('explore')">
            <span class="nav-icon">🔍</span>
            <span>استكشاف</span>
        </button>
        <button class="nav-item" onclick="navigateTo('add')">
            <span class="nav-icon add">+</span>
            <span>إضافة</span>
        </button>
        <button class="nav-item" onclick="navigateTo('notifications')">
            <span class="nav-icon">❤️</span>
            <span>الإشعارات</span>
        </button>
        <button class="nav-item" onclick="navigateTo('profile')">
            <span class="nav-icon">👤</span>
            <span>الملف</span>
        </button>
    </div>

    <!-- Comment Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeComments()"></div>
    <div class="comment-modal" id="commentModal">
        <div class="modal-header">
            <h3>التعليقات</h3>
            <button class="modal-close" onclick="closeComments()">✕</button>
        </div>
        <div class="comment-list" id="commentList">
            <!-- Comments will be populated by JavaScript -->
        </div>
        <div class="comment-input-area">
            <input type="text" id="commentInput" placeholder="أضف تعليقاً...">
            <button onclick="addComment()">إرسال</button>
        </div>
    </div>
</div>

<script>
    // Sample video data
    const videos = [
        {
            id: 1,
            username: 'ahmed_creative',
            description: 'رحلة إلى جبال الألب 🏔️ #طبيعة #سفر #مغامرات',
            likes: 1523,
            comments: 89,
            shares: 234,
            userInitial: 'أ'
        },
        {
            id: 2,
            username: 'nora_designs',
            description: 'فن الرسم بالأكريليك 🎨 #فن #رسم #إبداع',
            likes: 2341,
            comments: 156,
            shares: 412,
            userInitial: 'ن'
        },
        {
            id: 3,
            username: 'saif_tech',
            description: 'أحدث التقنيات في عالم البرمجة 💻 #تكنولوجيا #برمجة #AI',
            likes: 987,
            comments: 67,
            shares: 189,
            userInitial: 'س'
        },
        {
            id: 4,
            username: 'lina_fitness',
            description: 'تمارين الصباح للياقة 💪 #رياضة #صحة #لياقة',
            likes: 3456,
            comments: 234,
            shares: 567,
            userInitial: 'ل'
        },
        {
            id: 5,
            username: 'omar_music',
            description: 'مقطوعة موسيقية جديدة 🎵 #موسيقى #إبداع #فن',
            likes: 2876,
            comments: 198,
            shares: 321,
            userInitial: 'ع'
        }
    ];

    // Store comments for each video
    let commentsData = {};
    videos.forEach(v => {
        commentsData[v.id] = [
            { username: 'مستخدم 1', text: 'رائع جداً! 👏', initial: 'م' },
            { username: 'مستخدم 2', text: 'أعجبني كثيراً ❤️', initial: 'م' },
            { username: 'مستخدم 3', text: 'استمر بهذا الإبداع!', initial: 'م' }
        ];
    });

    // Store likes state
    let likesState = {};
    videos.forEach(v => {
        likesState[v.id] = { liked: false, count: v.likes };
    });

    let currentVideoId = 1;

    // Render videos
    function renderVideos() {
        const feed = document.getElementById('videoFeed');
        feed.innerHTML = '';

        videos.forEach((video, index) => {
            const item = document.createElement('div');
            item.className = 'video-item';
            item.dataset.id = video.id;

            const colors = ['#1a1a2e', '#16213e', '#0f3460', '#1a1a2e', '#16213e'];
            const gradient = `linear-gradient(45deg, ${colors[index % colors.length]}, ${colors[(index + 1) % colors.length]})`;

            item.innerHTML = `
                <div class="video-wrapper">
                    <div class="video-placeholder" style="background: ${gradient};">
                        <div class="play-icon">▶</div>
                        <div class="loading">فيديو تجريبي #${index + 1}</div>
                    </div>
                    <div class="video-overlay">
                        <div class="video-username">
                            @${video.username}
                            <span class="badge">متابع</span>
                        </div>
                        <div class="video-description">
                            ${video.description.replace(/#(\w+)/g, '<span class="hashtag">#$1</span>')}
                        </div>
                    </div>
                    <div class="side-actions">
                        <button class="action-btn" onclick="toggleLike(${video.id})">
                            <span class="icon ${likesState[video.id].liked ? 'liked' : ''}" id="likeIcon_${video.id}">❤️</span>
                            <span class="count" id="likeCount_${video.id}">${likesState[video.id].count}</span>
                        </button>
                        <button class="action-btn" onclick="openComments(${video.id})">
                            <span class="icon">💬</span>
                            <span class="count">${video.comments}</span>
                        </button>
                        <button class="action-btn" onclick="shareVideo(${video.id})">
                            <span class="icon">↗️</span>
                            <span class="count">${video.shares}</span>
                        </button>
                        <div class="action-btn">
                            <div class="profile-pic-small">${video.userInitial}</div>
                        </div>
                    </div>
                </div>
            `;

            feed.appendChild(item);
        });
    }

    // Like functionality
    function toggleLike(videoId) {
        const state = likesState[videoId];
        state.liked = !state.liked;
        state.count += state.liked ? 1 : -1;

        const icon = document.getElementById(`likeIcon_${videoId}`);
        const count = document.getElementById(`likeCount_${videoId}`);

        if (state.liked) {
            icon.classList.add('liked');
        } else {
            icon.classList.remove('liked');
        }
        count.textContent = state.count;

        // Haptic feedback simulation
        if (navigator.vibrate) {
            navigator.vibrate(10);
        }
    }

    // Share functionality
    function shareVideo(videoId) {
        const video = videos.find(v => v.id === videoId);
        if (navigator.share) {
            navigator.share({
                title: `فيديو من ${video.username}`,
                text: video.description,
                url: window.location.href
            }).catch(() => {});
        } else {
            alert(`تم نسخ الرابط! 🎉\nفيديو: ${video.description}`);
            // Copy to clipboard
            navigator.clipboard?.writeText(`شاهد هذا الفيديو الرائع: ${video.description}`).catch(() => {});
        }
    }

    // Comments functionality
    function openComments(videoId) {
        currentVideoId = videoId;
        const modal = document.getElementById('commentModal');
        const overlay = document.getElementById('modalOverlay');
        modal.classList.add('open');
        overlay.classList.add('open');
        renderComments(videoId);
        document.body.style.overflow = 'hidden';
    }

    function closeComments() {
        const modal = document.getElementById('commentModal');
        const overlay = document.getElementById('modalOverlay');
        modal.classList.remove('open');
        overlay.classList.remove('open');
        document.body.style.overflow = 'hidden';
    }

    function renderComments(videoId) {
        const list = document.getElementById('commentList');
        const comments = commentsData[videoId] || [];
        list.innerHTML = comments.map(c => `
            <div class="comment-item">
                <div class="comment-avatar">${c.initial}</div>
                <div class="comment-content">
                    <div class="comment-username">@${c.username}</div>
                    <div class="comment-text">${c.text}</div>
                </div>
            </div>
        `).join('');
    }

    function addComment() {
        const input = document.getElementById('commentInput');
        const text = input.value.trim();
        if (!text) return;

        const videoId = currentVideoId;
        if (!commentsData[videoId]) commentsData[videoId] = [];

        commentsData[videoId].push({
            username: 'أنت',
            text: text,
            initial: 'أ'
        });

        renderComments(videoId);
        input.value = '';

        // Update comment count in UI
        const video = videos.find(v => v.id === videoId);
        if (video) {
            video.comments += 1;
            // Update the comment count in the side actions
            const sideBtns = document.querySelectorAll(`.video-item[data-id="${videoId}"] .side-actions .action-btn`);
            if (sideBtns.length > 1) {
                const countSpan = sideBtns[1].querySelector('.count');
                if (countSpan) countSpan.textContent = video.comments;
            }
        }
    }

    // Enter key for comments
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.getElementById('commentModal').classList.contains('open')) {
            addComment();
        }
        if (e.key === 'Escape') {
            closeComments();
        }
    });

    // Navigation
    function navigateTo(page) {
        // Update active nav item
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        const navMap = {
            'home': 0,
            'explore': 1,
            'add': 2,
            'notifications': 3,
            'profile': 4
        };
        const index = navMap[page];
        if (index !== undefined) {
            document.querySelectorAll('.nav-item')[index].classList.add('active');
        }

        if (page === 'add') {
            alert('📸 افتح الكاميرا لتصوير فيديو جديد!');
        } else if (page === 'notifications') {
            alert('❤️ ليس لديك إشعارات جديدة');
        } else if (page === 'profile') {
            alert('👤 ملفك الشخصي');
        } else if (page === 'explore') {
            alert('🔍 صفحة الاستكشاف');
        }
    }

    // Auto-scroll to center video on load
    function centerFirstVideo() {
        const feed = document.getElementById('videoFeed');
        if (feed.children.length > 0) {
            const firstItem = feed.children[0];
            if (firstItem) {
                setTimeout(() => {
                    firstItem.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            }
        }
    }

    // Initialize
    renderVideos();
    centerFirstVideo();

    // Scroll to load more videos (infinite scroll simulation)
    let loadCount = 0;
    const feed = document.getElementById('videoFeed');
    feed.addEventListener('scroll', () => {
        if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 100) {
            // Simulate loading more videos
            loadCount++;
            if (loadCount < 3) {
                const moreVideos = videos.map(v => ({...v, id: v.id + loadCount * 5, username: v.username + loadCount}));
                // We won't actually add more to keep it clean, but show notification
                if (loadCount === 1) {
                    const loadingDiv = document.createElement('div');
                    loadingDiv.style.cssText = 'text-align:center;padding:20px;color:#888;';
                    loadingDiv.textContent = '🔄 جاري تحميل المزيد...';
                    feed.appendChild(loadingDiv);
                    setTimeout(() => loadingDiv.remove(), 1500);
                }
            }
        }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
            const feed = document.getElementById('videoFeed');
            feed.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
        } else if (e.key === 'ArrowDown') {
            const feed = document.getElementById('videoFeed');
            feed.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
        }
    });

    console.log('🚀 تطبيق M جاهز للاستخدام!');
    console.log('📱 اضغط على أيقونة القلب للإعجاب، أو 💬 للتعليق');
</script>

</body>
</html>
