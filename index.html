<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشاشة الرئيسية</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; text-align: center; width: 85%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    h1 { color: #0088cc; margin-bottom: 20px; }
    .msg-box { background: #2a2a2a; padding: 15px; border-radius: 8px; font-size: 18px; margin-top: 15px; border-right: 4px solid #0088cc; word-break: break-word; }
    .time { font-size: 12px; color: #888; margin-top: 8px; text-align: left; }
  </style>
</head>
<body>

  <div class="card">
    <h1>الرسالة المباشرة 📢</h1>
    <div id="displayArea" class="msg-box">جاري تحميل الرسالة...</div>
    <div id="timeArea" class="time"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://chatity-2da63-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    firebase.database().ref('liveMessage').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('displayArea').innerText = data.msg;
        document.getElementById('timeArea').innerText = "تم التحديث: " + (data.time || '');
      } else {
        document.getElementById('displayArea').innerText = "لا توجد رسائل حالياً";
        document.getElementById('timeArea').innerText = "";
      }
    });
  </script>

</body>
</html>
