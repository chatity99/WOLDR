<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatity</title>
  <style>
    :root { --primary: #075e54; --secondary: #128c7e; --bg: #f4f5f7; --blue-msg: #0078fe; --accent: #fe2c55; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: #fff; display: flex; flex-direction: column; height: 100%; position: relative; }
    
    .header { background: var(--primary); color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; background: var(--secondary); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #fff; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .tab-btn.active { border-bottom: 3px solid #fff; background: rgba(255,255,255,0.15); }

    .content-area { flex: 1; overflow-y: auto; padding: 12px; background: #efeae2; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; background: #fff; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 14px; }
    .msg.me { margin-right: auto; background: #dcf8c6; }
    .msg.system-blue { background: var(--blue-msg) !important; color: #fff !important; width: 92% !important; margin: 6px auto !important; border-radius: 10px; text-align: center; font-weight: bold; }
    
    .msg-header { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #555; }
    .avatar-mini { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    .verified-badge { background: #1da1f2; color: #fff; border-radius: 50%; padding: 1px 4px; font-size: 10px; margin-right: 4px; }
    .msg img { max-width: 100%; border-radius: 10px; margin-top: 6px; }

    .input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 6px; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 0 4px; }
    .btn-send { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }

    /* TikTok Profile Style */
    .profile-card { display: flex; flex-direction: column; align-items: center; padding: 20px; background: #fff; border-radius: 12px; }
    .profile-avatar-wrap { relative: position; width: 90px; height: 90px; margin-bottom: 10px; cursor: pointer; }
    .profile-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #eee; }
    .profile-stats { display: flex; gap: 24px; margin: 15px 0; text-align: center; }
    .stat-box span { display: block; font-weight: bold; font-size: 16px; }
    .stat-box label { font-size: 12px; color: #777; }
    .btn-tiktok { background: #fff; border: 1px solid #ccc; padding: 8px 24px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-tiktok.follow { background: var(--accent); color: #fff; border: none; }

    .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 99; }
    .modal-body { background: #fff; padding: 20px; border-radius: 12px; width: 88%; max-width: 340px; text-align: center; max-height: 90vh; overflow-y: auto; }
    .btn-action { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .form-input { width: 100%; padding: 8px 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, set, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJi3vI17B3pI7KF3c8CemUL0EB8s0XCDg",
      authDomain: "chatity-2da63.firebaseapp.com",
      databaseURL: "https://chatity-2da63-default-rtdb.firebaseio.com",
      projectId: "chatity-2da63",
      storageBucket: "chatity-2da63.firebasestorage.app",
      messagingSenderId: "68253755871",
      appId: "1:68253755871:web:5da50607c18b9b0218bc6a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let userData = {};
    let currentTab = "public";
    let activeDM = null;
    let mediaRecorder = null;
    let audioChunks = [];

    window.loginWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        
        onValue(ref(db, 'users/' + user.uid), (snapshot) => {
          userData = snapshot.val() || {};
          if (!snapshot.exists()) {
            const baseUser = user.email.split('@')[0];
            userData = { 
              name: user.displayName || 'مستخدم', 
              username: baseUser, 
              photo: user.photoURL || 'https://via.placeholder.com/90', 
              role: 'user', 
              verified: false, 
              bio: 'أهلاً بك في حسابي!',
              followersCount: 0,
              followingCount: 0,
              nameChanges: [],
              usernameChanges: []
            };
            set(ref(db, 'users/' + user.uid), userData);
          }
          document.getElementById('user-header-info').innerText = `${userData.name} [${userData.role}]`;
          if (userData.role === 'founder') {
            document.getElementById('blue-option').style.display = 'flex';
            document.getElementById('announcement-tab-btn').style.display = 'block';
          } else {
            document.getElementById('blue-option').style.display = 'none';
          }
        });

        switchTab('public');
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
      }
    });

    window.switchTab = (tab, dmUid = null) => {
      currentTab = tab;
      activeDM = dmUid;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');
      
      const inputArea = document.getElementById('input-area');
      inputArea.style.display = (tab === 'search' || tab === 'profile') ? 'none' : 'flex';

      if (tab === 'search') renderSearch();
      else if (tab === 'profile') renderProfile(currentUser.uid);
      else if (tab === 'dm') loadDMMessages(dmUid);
      else loadMessages(tab);
    };

    // Upload image using Cloudinary API for reliable URLs
    window.uploadImage = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'ml_default');

      try {
        const res = await fetch('https://api.cloudinary.com/v1_1/demo/image/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.secure_url) {
          postMessage({ image: data.secure_url });
        }
      } catch (err) {
        alert('حدث خطأ أثناء رفع الصورة');
      }
    };

    // Voice Notes
    window.toggleRecord = async () => {
      const recBtn = document.getElementById('rec-btn');
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => {
            postMessage({ audio: reader.result });
          };
        };
        mediaRecorder.start();
        recBtn.innerText = '🔴';
      } else {
        mediaRecorder.stop();
        recBtn.innerText = '🎙️';
      }
    };

    window.sendMessage = () => {
      const input = document.getElementById('msg-input');
      if (!input.value.trim()) return;
      postMessage({ text: input.value });
      input.value = '';
    };

    function postMessage(content) {
      const isBlue = document.getElementById('blue-msg-check')?.checked && userData.role === 'founder';
      const msgData = {
        senderUid: isBlue ? 'system' : currentUser.uid,
        senderName: isBlue ? '' : userData.name,
        photo: isBlue ? '' : userData.photo,
        isVerified: isBlue ? false : !!userData.verified,
        role: isBlue ? '' : userData.role,
        isSystemBlue: isBlue,
        timestamp: Date.now(),
        ...content
      };

      if (currentTab === 'dm') {
        const chatKey = [currentUser.uid, activeDM].sort().join('_');
        push(ref(db, `direct_messages/${chatKey}`), msgData);
      } else {
        push(ref(db, `messages/${currentTab}`), msgData);
      }
    }

    function loadMessages(tab) {
      onValue(ref(db, `messages/${tab}`), (snapshot) => {
        renderMessageList(snapshot);
      });
    }

    function loadDMMessages(targetUid) {
      const chatKey = [currentUser.uid, targetUid].sort().join('_');
      onValue(ref(db, `direct_messages/${chatKey}`), (snapshot) => {
        renderMessageList(snapshot);
      });
    }

    function renderMessageList(snapshot) {
      const box = document.getElementById('content-box');
      box.innerHTML = '';
      snapshot.forEach((child) => {
        const m = child.val();
        const key = child.key;
        const div = document.createElement('div');
        
        if (m.isSystemBlue) {
          div.className = 'msg system-blue';
          div.innerText = m.text;
        } else {
          div.className = `msg ${m.senderUid === currentUser.uid ? 'me' : ''}`;
          let actions = '';
          if (userData.role === 'founder' || (userData.role === 'helper' && m.role === 'user')) {
            actions = `<span onclick="deleteMsg('${key}')" style="color:red;cursor:pointer;margin-right:6px;">🗑️</span>`;
          }

          div.innerHTML = `
            <div class="msg-header">
              <img src="${m.photo || 'https://via.placeholder.com/26'}" class="avatar-mini">
              <span onclick="renderProfile('${m.senderUid}')" style="cursor:pointer">${m.senderName}</span>
              ${m.isVerified ? '<span class="verified-badge">✓</span>' : ''}
              ${actions}
            </div>
            ${m.text ? `<div>${m.text}</div>` : ''}
            ${m.image ? `<img src="${m.image}">` : ''}
            ${m.audio ? `<audio controls src="${m.audio}"></audio>` : ''}
          `;
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    window.deleteMsg = (key) => {
      const path = currentTab === 'dm' ? `direct_messages/${[currentUser.uid, activeDM].sort().join('_')}/${key}` : `messages/${currentTab}/${key}`;
      remove(ref(db, path));
    };

    // Profile Screen (TikTok Style)
    window.renderProfile = (targetUid) => {
      onValue(ref(db, 'users/' + targetUid), (snapshot) => {
        const u = snapshot.val() || {};
        const isSelf = targetUid === currentUser.uid;
        const box = document.getElementById('content-box');
        
        box.innerHTML = `
          <div class="profile-card">
            <div class="profile-avatar-wrap" onclick="${isSelf ? "document.getElementById('avatar-file').click()" : ""}">
              <img src="${u.photo || 'https://via.placeholder.com/90'}" class="profile-avatar">
            </div>
            <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
            
            <h3 style="display:flex;align-items:center;gap:4px;">
              ${u.name} ${u.verified ? '<span class="verified-badge">✓</span>' : ''}
            </h3>
            <span style="color:#777;font-size:13px;margin-top:2px;">@${u.username}</span>
            
            <div class="profile-stats">
              <div class="stat-box"><span>${u.followingCount || 0}</span><label>أتابعهم</label></div>
              <div class="stat-box"><span>${u.followersCount || 0}</span><label>متابعون</label></div>
            </div>

            <p style="font-size:13px;color:#444;margin-bottom:15px;text-align:center;">${u.bio || 'لا يوجد وصف'}</p>

            ${isSelf ? `
              <button class="btn-tiktok" onclick="openEditModal()">تعديل الملف الشخصي (Edit)</button>
            ` : `
              <div style="display:flex;gap:8px;">
                <button class="btn-tiktok follow" onclick="toggleFollow('${targetUid}')">متابعة</button>
                <button class="btn-tiktok" onclick="switchTab('dm', '${targetUid}')">مراسلة خاصة 💬</button>
              </div>
            `}

            ${userData.role === 'founder' && !isSelf ? `
              <div style="margin-top:15px;width:100%;border-top:1px solid #eee;padding-top:10px;">
                <p style="font-size:12px;font-weight:bold;color:red;">لوحة التحكم بالرتب (Founder):</p>
                <button class="btn-action" style="background:#2196F3;color:#fff;" onclick="toggleVerify('${targetUid}', ${!u.verified})">${u.verified ? 'إزالة التوثيق' : 'منح التوثيق ✅'}</button>
                <button class="btn-action" style="background:#ff9800;color:#fff;" onclick="setRole('${targetUid}', 'helper')">تعيين Helper</button>
                <button class="btn-action" style="background:#f44336;color:#fff;" onclick="setRole('${targetUid}', 'user')">تنزيل إلى User</button>
              </div>
            ` : ''}
          </div>
        `;
      });
    };

    window.uploadAvatar = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'ml_default');

      const res = await fetch('https://api.cloudinary.com/v1_1/demo/image/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.secure_url) {
        update(ref(db, 'users/' + currentUser.uid), { photo: data.secure_url });
      }
    };

    window.openEditModal = () => {
      document.getElementById('modal-content').innerHTML = `
        <h3>تعديل الملف الشخصي</h3>
        <input type="text" id="edit-name" class="form-input" value="${userData.name}" placeholder="الاسم الجديد">
        <input type="text" id="edit-username" class="form-input" value="${userData.username}" placeholder="اسم المستخدم (بدون @)">
        <textarea id="edit-bio" class="form-input" placeholder="الوصف (Bio)">${userData.bio || ''}</textarea>
        <button class="btn-action" style="background:var(--primary);color:#fff;" onclick="saveProfileChanges()">حفظ التعديلات</button>
        <button class="btn-action" onclick="closeModal()">إلغاء</button>
      `;
      document.getElementById('modal').style.display = 'flex';
    };

    window.saveProfileChanges = async () => {
      const newName = document.getElementById('edit-name').value.trim();
      let newUsername = document.getElementById('edit-username').value.trim().replace('@', '');
      const newBio = document.getElementById('edit-bio').value.trim();

      const now = Date.now();
      const nameChanges = userData.nameChanges || [];
      const usernameChanges = userData.usernameChanges || [];

      // Name Rule: Max 3 times in 30 days
      const validNameChanges = nameChanges.filter(t => now - t < 30 * 86400 * 1000);
      if (newName !== userData.name && validNameChanges.length >= 3) {
        alert('يمكنك تغيير الاسم 3 مرات فقط كل 30 يوم!');
        return;
      }

      // Username Rule: Max 2 times in 7 days
      const validUsernameChanges = usernameChanges.filter(t => now - t < 7 * 86400 * 1000);
      if (newUsername !== userData.username && validUsernameChanges.length >= 2) {
        alert('يمكنك تغيير اسم المستخدم مرتين فقط كل 7 أيام!');
        return;
      }

      // Check unique username
      if (newUsername !== userData.username) {
        const checkSnap = await get(ref(db, 'users'));
        let isTaken = false;
        checkSnap.forEach(c => { if (c.val().username === newUsername) isTaken = true; });
        if (isTaken) { alert('اسم المستخدم هذا مستخدم بالفعل!'); return; }
      }

      if (newName !== userData.name) validNameChanges.push(now);
      if (newUsername !== userData.username) validUsernameChanges.push(now);

      update(ref(db, 'users/' + currentUser.uid), {
        name: newName,
        username: newUsername,
        bio: newBio,
        nameChanges: validNameChanges,
        usernameChanges: validUsernameChanges
      }).then(() => {
        closeModal();
        renderProfile(currentUser.uid);
      });
    };

    function renderSearch() {
      const box = document.getElementById('content-box');
      box.innerHTML = `
        <input type="text" id="search-input" class="form-input" placeholder="ابحث باسم المستخدم أو الاسم..." oninput="executeSearch(this.value)">
        <div id="search-results" style="margin-top:10px;"></div>
      `;
    }

    window.executeSearch = (val) => {
      const res = document.getElementById('search-results');
      if (!val.trim()) { res.innerHTML = ''; return; }
      
      val = val.toLowerCase().replace('@', '');
      onValue(ref(db, 'users'), (snapshot) => {
        res.innerHTML = '';
        snapshot.forEach((child) => {
          const u = child.val();
          const uid = child.key;
          if (u.username?.toLowerCase().includes(val) || u.name?.toLowerCase().includes(val)) {
            res.innerHTML += `
              <div style="background:#fff;padding:10px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <img src="${u.photo || 'https://via.placeholder.com/30'}" style="width:35px;height:35px;border-radius:50%;">
                  <div>
                    <b>${u.name}</b> ${u.verified ? '✅' : ''}<br>
                    <small style="color:#777;">@${u.username}</small>
                  </div>
                </div>
                <button class="btn-tiktok" onclick="renderProfile('${uid}')">عرض الملف</button>
              </div>
            `;
          }
        });
      }, { onlyOnce: true });
    };

    window.toggleVerify = (uid, status) => { update(ref(db, 'users/' + uid), { verified: status }); closeModal(); };
    window.setRole = (uid, role) => { update(ref(db, 'users/' + uid), { role: role }); closeModal(); };
    window.closeModal = () => document.getElementById('modal').style.display = 'none';
  </script>
</head>
<body>

  <div id="login-screen" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;gap:15px;">
    <h2>Chatity App</h2>
    <button onclick="loginWithGoogle()" style="padding:10px 20px;background:#4285f4;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">دخول بواسطة Google</button>
  </div>

  <div id="app-screen" class="app-container" style="display:none;">
    <div class="header">
      <span id="user-header-info">...</span>
      <button onclick="logout()" style="background:#d32f2f;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;">خروج</button>
    </div>

    <div class="nav-tabs">
      <button id="tab-public" class="tab-btn active" onclick="switchTab('public')">العام</button>
      <button id="tab-announcements" class="tab-btn" onclick="switchTab('announcements')" style="display:none;">الإشعارات 📢</button>
      <button id="tab-search" class="tab-btn" onclick="switchTab('search')">بحث 🔍</button>
      <button id="tab-profile" class="tab-btn" onclick="switchTab('profile')">حسابي 👤</button>
    </div>

    <div id="content-box" class="content-area"></div>

    <div id="input-area" class="input-area">
      <button class="icon-btn" onclick="document.getElementById('img-file').click()">📷</button>
      <input type="file" id="img-file" accept="image/*" style="display:none" onchange="uploadImage(event)">
      
      <button id="rec-btn" class="icon-btn" onclick="toggleRecord()">🎙️</button>

      <input type="text" id="msg-input" placeholder="اكتب رسالة...">
      
      <label id="blue-option" style="font-size:11px;display:none;align-items:center;gap:2px;">
        <input type="checkbox" id="blue-msg-check"> أزرق
      </label>

      <button class="btn-send" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <div id="modal" class="modal">
    <div id="modal-content" class="modal-body"></div>
  </div>

</body>
</html>
