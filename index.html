<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatity Super App</title>
  <style>
    :root { --primary: #075e54; --secondary: #128c7e; --bg: #efeae2; --accent: #fe2c55; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: #fff; display: flex; flex-direction: column; height: 100%; position: relative; }
    
    .header { background: var(--primary); color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .header-tools { display: flex; align-items: center; gap: 12px; }
    .tool-icon-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; position: relative; }
    .notif-badge { position: absolute; top: -3px; right: -5px; background: red; color: white; border-radius: 50%; font-size: 10px; padding: 1px 4px; font-weight: bold; }

    .nav-tabs { display: flex; background: var(--secondary); overflow-x: auto; }
    .tab-btn { flex: 1; min-width: 65px; padding: 12px 6px; border: none; background: transparent; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; white-space: nowrap; }
    .tab-btn.active { border-bottom: 3px solid #fff; background: rgba(255,255,255,0.15); }

    .content-area { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; position: relative; }
    
    /* Group Header Overlay */
    .group-header { display: flex; align-items: center; justify-content: space-between; background: var(--primary); color: #fff; padding: 8px 12px; }
    .group-info-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .group-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: #fff; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 14px; position: relative; word-break: break-word; user-select: none; transition: background 0.3s; }
    .msg.me { margin-right: auto; background: #dcf8c6; }
    .msg.highlight { animation: highlightAnim 1.5s ease; }
    @keyframes highlightAnim { 0% { background: #fff9c4; } 100% { background: inherit; } }
    
    .msg-header { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #555; }
    .avatar-mini { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    
    .badge-blue { background: #1da1f2; color: #fff; border-radius: 50%; padding: 0 4px; font-size: 10px; }
    .badge-black { background: #000; color: #fff; border-radius: 50%; padding: 0 4px; font-size: 10px; }

    .msg img, .msg video { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 5px; cursor: pointer; display: block; }
    .reactions-list { display: flex; gap: 4px; font-size: 12px; margin-top: 4px; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 10px; width: fit-content; cursor: pointer; }

    .reply-preview { background: rgba(0,0,0,0.06); border-right: 3px solid var(--primary); padding: 4px 8px; font-size: 11px; border-radius: 4px; margin-bottom: 4px; opacity: 0.85; cursor: pointer; }

    .input-area { padding: 8px; background: #f0f0f0; display: none; gap: 6px; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
    .btn-send { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; }

    .profile-card { display: flex; flex-direction: column; align-items: center; padding: 15px; background: #fff; border-radius: 12px; position: relative; }
    .btn-close-profile { position: absolute; top: 10px; left: 10px; background: #eee; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }
    .profile-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; margin-bottom: 8px; }

    .user-item { background: #fff; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

    .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 99; }
    .modal-body { background: #fff; padding: 18px; border-radius: 12px; width: 88%; max-width: 340px; text-align: center; max-height: 85vh; overflow-y: auto; }
    .btn-full { width: 100%; padding: 8px; margin-top: 6px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .form-input { width: 100%; padding: 8px 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; }

    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; }
    #lightbox img { max-width: 90%; max-height: 80vh; border-radius: 8px; }
    
    .stats-container { display: flex; gap: 20px; margin: 8px 0; font-size: 13px; color: #555; }
    .stat-box { text-align: center; }
    .stat-number { font-weight: bold; color: #000; display: block; }

    /* Reels Section CSS */
    .reels-container { display: flex; flex-direction: column; gap: 20px; snap-type: y mandatory; overflow-y: scroll; height: 100%; padding-bottom: 20px; }
    .reel-card { snap-align: start; min-height: 80vh; background: #000; border-radius: 16px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .reel-card video { width: 100%; height: 100%; object-fit: cover; }
    .reel-overlay { position: absolute; bottom: 15px; left: 15px; right: 15px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); display: flex; justify-content: space-between; align-items: flex-end; }
    .reel-info { flex: 1; }
    .reel-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .action-btn { background: rgba(0,0,0,0.4); border: none; color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, set, update, get, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJi3vI17B3pI7KF3c8CemUL0EB8s0XCDg",
      authDomain: "chatity-2da63.firebaseapp.com",
      databaseURL: "https://chatity-2da63-default-rtdb.firebaseio.com",
      projectId: "chatity-2da63",
      storageBucket: "chatity-2da63.firebasestorage.app",
      messagingSenderId: "68253755871",
      appId: "1:68253755871:web:5da50607c18b9b0218bc6a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let userData = {};
    let currentTab = "public";
    let activeDM = null;
    let activeGroup = null;
    let replyingTo = null;
    let mediaRecorder = null;
    let audioChunks = [];

    window.loginWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snap = await get(ref(db, 'users/' + user.uid));
        
        if (!snap.exists() || !snap.val().username || snap.val().username.length < 2) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('setup-profile-screen').style.display = 'flex';
          document.getElementById('setup-name').value = user.displayName || '';
        } else {
          initApp(user);
        }
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('setup-profile-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'none';
      }
    });

    window.completeProfileSetup = async () => {
      const name = document.getElementById('setup-name').value.trim();
      const username = document.getElementById('setup-username').value.trim().replace('@', '');

      if (!name || username.length < 2) {
        alert('يرجى كتابة اسم واسم مستخدم صالح (حرفين أو أكثر)');
        return;
      }

      const initialData = {
        name: name,
        username: username,
        photo: currentUser.photoURL || 'https://via.placeholder.com/85',
        role: 'user',
        verified: false,
        bio: 'أهلاً بك في حسابي!',
        isBanned: false,
        isMuted: false,
        muteUntil: 0
      };

      await set(ref(db, 'users/' + currentUser.uid), initialData);
      document.getElementById('setup-profile-screen').style.display = 'none';
      initApp(currentUser);
    };

    function initApp(user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'flex';

      onValue(ref(db, 'users/' + user.uid), (snapshot) => {
        userData = snapshot.val() || {};

        if (userData.isBanned) {
          alert('تم حظر حسابك من التطبيق!');
          signOut(auth);
          return;
        }

        document.getElementById('user-header-info').innerText = `${userData.name} [${userData.role}]`;
        document.getElementById('btn-shield').style.display = (userData.role === 'founder' || userData.role === 'helper') ? 'inline-block' : 'none';
        document.getElementById('btn-support-admin').style.display = (userData.role === 'founder' || userData.role === 'helper') ? 'inline-block' : 'none';
      });

      set(ref(db, `online_status/${user.uid}`), true);
      onDisconnect(ref(db, `online_status/${user.uid}`)).remove();

      listenNotifications();
      switchTab('public');
    }

    window.switchTab = (tab, targetId = null) => {
      currentTab = tab;
      activeDM = (tab === 'dm') ? targetId : null;
      activeGroup = (tab === 'group') ? targetId : null;

      const groupHeader = document.getElementById('group-header');
      const navTabs = document.getElementById('nav-tabs');

      if (tab === 'group') {
        navTabs.style.display = 'none';
        groupHeader.style.display = 'flex';
        loadGroupHeaderInfo(targetId);
      } else {
        navTabs.style.display = 'flex';
        groupHeader.style.display = 'none';
      }

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');

      const inputArea = document.getElementById('input-area');
      const canSend = (tab === 'public') ||
                      (tab === 'dm') ||
                      (tab === 'group') ||
                      (tab === 'support_chat') ||
                      (tab === 'announcements' && userData.role === 'founder') ||
                      (tab === 'shield' && (userData.role === 'founder' || userData.role === 'helper'));

      inputArea.style.display = canSend ? 'flex' : 'none';

      if (tab === 'reels') renderReelsSection();
      else if (tab === 'search') renderSearch();
      else if (tab === 'profile') renderProfile(currentUser.uid);
      else if (tab === 'inbox') renderInbox();
      else if (tab === 'dm') loadDMMessages(targetId);
      else if (tab === 'group') loadGroupMessages(targetId);
      else if (tab === 'support') renderSupportSection();
      else if (tab === 'support_admin') renderAdminSupportTickets();
      else if (tab === 'support_chat') loadSupportChat(targetId);
      else loadMessages(tab);
    };

    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    window.uploadImage = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const base64 = await fileToBase64(file);
        postMessage({ image: base64 });
      } catch (err) { alert('خطأ أثناء تحميل الصورة'); }
    };

    /* --- إرسال الفيديوهات الشات والجروبات --- */
    window.uploadVideoMsg = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 20 * 1024 * 1024) {
        alert('حجم الفيديو كبير جداً (الأقصى 20 ميجابايت)');
        return;
      }
      try {
        alert("جاري تحضير وإرسال الفيديو...");
        const base64 = await fileToBase64(file);
        postMessage({ video: base64 });
      } catch (err) { alert('خطأ أثناء رفع الفيديو بالشات'); }
    };

    window.toggleVoiceRecording = async () => {
      const btn = document.getElementById('btn-voice');
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => postMessage({ audio: reader.result });
          };
          mediaRecorder.start();
          btn.innerText = "🛑";
          btn.style.color = "red";
        } catch (err) { alert('تعذر الوصول للمايكروفون'); }
      } else {
        mediaRecorder.stop();
        btn.innerText = "🎤";
        btn.style.color = "black";
      }
    };

    window.sendMessage = () => {
      if (userData.isMuted && userData.muteUntil > Date.now()) {
        alert('أنت مكتوم حالياً ولا يمكنك إرسال الرسائل!');
        return;
      }
      const input = document.getElementById('msg-input');
      if (!input.value.trim()) return;

      postMessage({ text: input.value });
      input.value = '';
      replyingTo = null;
      document.getElementById('reply-preview-box').style.display = 'none';
    };

    async function postMessage(content) {
      if (currentTab === 'dm') {
        const blockedSnap = await get(ref(db, `blocks/${activeDM}/${currentUser.uid}`));
        if (blockedSnap.exists()) {
          alert('لا يمكنك المراسلة، تم حظرك من قبل هذا المستخدم.');
          return;
        }
      }

      const msgData = {
        senderUid: currentUser.uid,
        senderName: userData.name,
        photo: userData.photo,
        isVerified: !!userData.verified,
        role: userData.role,
        timestamp: Date.now(),
        replyTo: replyingTo || null,
        ...content
      };

      if (currentTab === 'dm') {
        const chatKey = [currentUser.uid, activeDM].sort().join('_');
        push(ref(db, `direct_messages/${chatKey}`), msgData);
        set(ref(db, `inbox/${currentUser.uid}/${activeDM}`), { lastUpdated: Date.now() });
        set(ref(db, `inbox/${activeDM}/${currentUser.uid}`), { lastUpdated: Date.now() });
        push(ref(db, `notifications/${activeDM}`), { type: 'msg', fromName: userData.name, timestamp: Date.now() });
      } else if (currentTab === 'group') {
        push(ref(db, `group_messages/${activeGroup}`), msgData);
      } else if (currentTab === 'support_chat') {
        push(ref(db, `tickets/${activeDM}/messages`), msgData);
      } else {
        push(ref(db, `messages/${currentTab}`), msgData);
      }
    }

    function loadMessages(tab) {
      onValue(ref(db, `messages/${tab}`), snapshot => renderMessageList(snapshot));
    }

    function loadDMMessages(targetUid) {
      const chatKey = [currentUser.uid, targetUid].sort().join('_');
      onValue(ref(db, `direct_messages/${chatKey}`), snapshot => renderMessageList(snapshot));
    }

    function loadGroupMessages(groupId) {
      onValue(ref(db, `group_messages/${groupId}`), snapshot => renderMessageList(snapshot));
    }

    function loadSupportChat(ticketId) {
      onValue(ref(db, `tickets/${ticketId}/messages`), snapshot => renderMessageList(snapshot));
    }

    function renderMessageList(snapshot) {
      const box = document.getElementById('content-box');
      box.innerHTML = '';
      snapshot.forEach((child) => {
        const m = child.val();
        const key = child.key;
        const isMyMsg = m.senderUid === currentUser.uid;

        const div = document.createElement('div');
        div.className = `msg ${isMyMsg ? 'me' : ''}`;
        div.id = `msg-${key}`;

        let canDelete = isMyMsg || 
                        userData.role === 'founder' || 
                        (userData.role === 'helper' && m.role !== 'founder' && m.role !== 'helper');

        let badgeHtml = '';
        if (m.isVerified) badgeHtml += `<span class="badge-blue">✓</span>`;
        if (m.role === 'helper') badgeHtml += `<span class="badge-black">✓</span>`;

        let replyHtml = m.replyTo ? `<div class="reply-preview" onclick="scrollToMessage('${m.replyTo.key}')"><b>${m.replyTo.name}:</b> ${m.replyTo.text}</div>` : '';

        let touchStartX = 0;
        div.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX, {passive: true});
        div.addEventListener('touchend', e => {
          if (e.changedTouches[0].clientX - touchStartX > 60) {
            setReply(key, m.senderName, m.text || 'ميديا');
          }
        }, {passive: true});

        let myReaction = m.reactions ? m.reactions[currentUser.uid] : null;

        div.innerHTML = `
          ${replyHtml}
          <div class="msg-header">
            <img src="${m.photo || 'https://via.placeholder.com/24'}" class="avatar-mini">
            <span onclick="renderProfile('${m.senderUid}')" style="cursor:pointer">${m.senderName}</span>
            ${badgeHtml}
            ${canDelete ? `<span onclick="deleteMsg('${key}')" style="color:red;cursor:pointer;margin-right:auto;">🗑️</span>` : ''}
          </div>
          ${m.text ? `<div>${m.text.replace(/@everyone/g, '<b style="color:red;background:#fff0f0;padding:0 2px;">@everyone</b>')}</div>` : ''}
          ${m.image ? `<img src="${m.image}" onclick="openLightbox('${m.image}')">` : ''}
          ${m.video ? `<video src="${m.video}" controls style="width:100%;border-radius:8px;margin-top:5px;"></video>` : ''}
          ${m.audio ? `<audio controls src="${m.audio}" style="max-width:200px;margin-top:5px;"></audio>` : ''}
          
          <div style="display:flex;gap:8px;margin-top:4px;font-size:11px;color:#777;">
            <span onclick="setReply('${key}', '${m.senderName}', '${m.text || 'ميديا'}')" style="cursor:pointer;">رد ↩️</span>
            <span onclick="toggleReaction('${key}', '❤️')" style="cursor:pointer;">❤️</span>
            <span onclick="toggleReaction('${key}', '👍')" style="cursor:pointer;">👍</span>
            <span onclick="toggleReaction('${key}', '😂')" style="cursor:pointer;">😂</span>
          </div>

          ${myReaction ? `<div class="reactions-list" onclick="toggleReaction('${key}', '${myReaction}')">${myReaction}</div>` : ''}
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    /* ---- Reels Section Logic ---- */
    function renderReelsSection() {
      const box = document.getElementById('content-box');
      box.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h3>🎬 الريلز والفيديوهات</h3>
          <button class="btn-send" onclick="openUploadReelModal()">+ نشر فيديو</button>
        </div>
        <div class="reels-container" id="reels-list"></div>
      `;

      onValue(ref(db, 'reels'), snapshot => {
        const reelsList = document.getElementById('reels-list');
        if (!reelsList) return;
        reelsList.innerHTML = '';

        if (!snapshot.exists()) {
          reelsList.innerHTML = '<p style="text-align:center;padding:20px;">لا يوجد فيديوهات منشورة بعد</p>';
          return;
        }

        snapshot.forEach(child => {
          const reel = child.val();
          const key = child.key;
          const likesCount = reel.likes ? Object.keys(reel.likes).length : 0;
          const isLiked = reel.likes && reel.likes[currentUser.uid];

          const card = document.createElement('div');
          card.className = 'reel-card';
          card.innerHTML = `
            <video src="${reel.videoUrl}" controls playsinline loop></video>
            <div class="reel-overlay">
              <div class="reel-info">
                <b>@${reel.senderName}</b>
                <p style="font-size:12px;">${reel.caption || ''}</p>
              </div>
              <div class="reel-actions">
                <button class="action-btn" onclick="toggleLikeReel('${key}')">
                  ${isLiked ? '❤️' : '🤍'}
                  <span style="font-size:10px;">${likesCount}</span>
                </button>
                ${(reel.senderUid === currentUser.uid || userData.role === 'founder') ? `
                  <button class="action-btn" style="background:rgba(255,0,0,0.6);" onclick="deleteReel('${key}')">🗑️</button>
                ` : ''}
              </div>
            </div>
          `;
          reelsList.appendChild(card);
        });
      });
    }

    window.openUploadReelModal = () => {
      document.getElementById('modal-content').innerHTML = `
        <h3>نشر فيديو ريلز جديد 🎬</h3>
        <input type="file" id="reel-file" accept="video/*" class="form-input">
        <input type="text" id="reel-caption" class="form-input" placeholder="الوصف أو التعليق...">
        <button class="btn-full" style="background:var(--primary);color:#fff;" onclick="uploadReel()">نشر الأن 🚀</button>
        <button class="btn-full" onclick="closeModal()">إلغاء</button>
      `;
      document.getElementById('modal').style.display = 'flex';
    };

    window.uploadReel = async () => {
      const file = document.getElementById('reel-file').files[0];
      const caption = document.getElementById('reel-caption').value.trim();

      if (!file) { alert('يرجى اختيار ملف فيديو!'); return; }
      if (file.size > 20 * 1024 * 1024) { alert('حجم الفيديو كبير جداً (الأقصى 20 ميجابايت)'); return; }

      try {
        alert("جاري رفع ونشر الفيديو...");
        const videoBase64 = await fileToBase64(file);
        push(ref(db, 'reels'), {
          senderUid: currentUser.uid,
          senderName: userData.name,
          videoUrl: videoBase64,
          caption: caption,
          timestamp: Date.now()
        });
        closeModal();
        alert('تم نشر الفيديو بنجاح!');
      } catch (err) { alert('حدث خطأ أثناء تحميل الفيديو'); }
    };

    window.toggleLikeReel = (reelKey) => {
      get(ref(db, `reels/${reelKey}/likes/${currentUser.uid}`)).then(snap => {
        if (snap.exists()) {
          remove(ref(db, `reels/${reelKey}/likes/${currentUser.uid}`));
        } else {
          set(ref(db, `reels/${reelKey}/likes/${currentUser.uid}`), true);
        }
      });
    };

    window.deleteReel = (reelKey) => {

                  ${u.isMuted ? `

    window.uploadReelFromProfile = async () => {
      const file = document.getElementById('profile-reel-file').files[0];
      const caption = document.getElementById('profile-reel-caption').value.trim();

      if (!file) { alert('يرجى اختيار فيديو أولاً!'); return; }
      if (file.size > 20 * 1024 * 1024) { alert('حجم الفيديو كبير جداً (الأقصى 20 ميجابايت)'); return; }

      try {
        alert("جاري رفع الفيديو ونشره بالريلز...");
        const videoBase64 = await fileToBase64(file);
        push(ref(db, 'reels'), {
          senderUid: currentUser.uid,
          senderName: userData.name,
          videoUrl: videoBase64,
          caption: caption,
          timestamp: Date.now()
        });
        alert('تم نشر الفيديو بنجاح في قسم الريلز العام! 🎉');
        renderProfile(currentUser.uid);
      } catch (err) { alert('حدث خطأ أثناء رفع الفيديو'); }

      const snap = await get(ref(db, `following/${currentUser.uid}/${targetUid}`));
      return snap.exists();
    }

      const isFollowing = await checkFollowStatus(targetUid);
      if (isFollowing) {
        remove(ref(db, `following/${currentUser.uid}/${targetUid}`));
        remove(ref(db, `followers/${targetUid}/${currentUser.uid}`));
      } else {
        set(ref(db, `following/${currentUser.uid}/${targetUid}`), true);
        set(ref(db, `followers/${targetUid}/${currentUser.uid}`), true);
        push(ref(db, `notifications/${targetUid}`), {
          type: 'follow', fromName: userData.name, timestamp: Date.now()
        });
      }
      renderProfile(targetUid);

      return snap.exists();

        <button class="btn-full" style="background:red;color:#fff;" onclick="applyPunishment('${targetUid}', '${type}')">تطبيق للإدارة</button>
        <button class="btn-full" onclick="closeModal()">إلغاء</button>
      `;
      document.getElementById('modal').style.display = 'flex';
    };

    window.applyPunishment = async (targetUid, type) => {
      const timeStr = document.getElementById('punish-time').value.trim();
      const reason = document.getElementById('punish-reason').value.trim();
      const proofFile = document.getElementById('punish-proof').files[0];

      let proofBase64 = '';
      if (proofFile) proofBase64 = await fileToBase64(proofFile);

      let durationMs = 0;
      if (timeStr.endsWith('t')) durationMs = parseInt(timeStr) * 60 * 1000;
      else if (timeStr.endsWith('d')) durationMs = parseInt(timeStr) * 24 * 60 * 60 * 1000;

      if (type === 'mute') {
        update(ref(db, 'users/' + targetUid), { isMuted: true, muteUntil: Date.now() + durationMs });
      } else if (type === 'ban') {
        update(ref(db, 'users/' + targetUid), { isBanned: true });
      } else if (type === 'delete') {
        remove(ref(db, 'users/' + targetUid));
      }

      const targetSnap = await get(ref(db, 'users/' + targetUid));
      const targetName = targetSnap.exists() ? targetSnap.val().name : targetUid;

      push(ref(db, 'messages/shield'), {
        senderUid: currentUser.uid,
        senderName: '🛡️ نظام الإدارة',
        photo: 'https://via.placeholder.com/24',
        text: `⚠️ [إجراء إداري - ${type.toUpperCase()}]\n👤 المستهدف: ${targetName}\n⏱️ المدة: ${timeStr || 'دائم'}\n📝 السبب: ${reason || 'بدون سبب'}`,

        timestamp: Date.now()
      });

      closeModal();
      renderProfile(targetUid);
    };

          badge.style.display = 'block';
          badge.innerText = snapshot.size;
        } else {
          badge.style.display = 'none';
        }
      });
    }

    window.openNotifications = () => {
      onValue(ref(db, `notifications/${currentUser.uid}`), snapshot => {
        let listHtml = '';
        snapshot.forEach(c => {
          const n = c.val();
          listHtml += `<div style="padding:6px 0;border-bottom:1px solid #eee;font-size:13px;">${n.fromName} ${n.type === 'follow' ? 'قام بمتابعتك 👤' : 'أرسل لك رسالة 💬'}</div>`;
        });

        document.getElementById('modal-content').innerHTML = `
          <h3>الإشعارات 🔔</h3>
          <div style="max-height:200px;overflow-y:auto;">${listHtml || '<p>لا توجد إشعارات جديدة</p>'}</div>
          <button class="btn-full" onclick="clearNotifs()">تم القراءة ومسح الكل</button>
        `;
        document.getElementById('modal').style.display = 'flex';
      }, { onlyOnce: true });
    };

    window.clearNotifs = () => {
      remove(ref(db, `notifications/${currentUser.uid}`));
      document.getElementById('notif-badge').style.display = 'none';
      closeModal();
    };

    window.openCreateGroupModal = () => {
      document.getElementById('modal-content').innerHTML = `
        <h3>إنشاء كروب جديد</h3>
        <input type="text" id="group-name" class="form-input" placeholder="اسم الكروب">
        <button class="btn-full" style="background:var(--primary);color:#fff;" onclick="createGroup()">إنشاء</button>
        <button class="btn-full" onclick="closeModal()">إلغاء</button>
      `;
      document.getElementById('modal').style.display = 'flex';
    };

    window.createGroup = () => {
      const name = document.getElementById('group-name').value.trim();
      if (!name) return;
      const gRef = push(ref(db, 'groups'));
      set(gRef, {
        name,
        owner: currentUser.uid,
        members: { [currentUser.uid]: true }
      });
      closeModal();
      renderInbox();
    };

    window.openEditModal = () => {
      document.getElementById('modal-content').innerHTML = `
        <h3>تعديل الملف الشخصي</h3>
        <input type="text" id="edit-name" class="form-input" value="${userData.name}" placeholder="الاسم">
        <input type="text" id="edit-username" class="form-input" value="${userData.username}" placeholder="اسم المستخدم">
        <textarea id="edit-bio" class="form-input" placeholder="الوصف">${userData.bio || ''}</textarea>
        <button class="btn-full" style="background:var(--primary);color:#fff;" onclick="saveProfileChanges()">حفظ</button>
        <button class="btn-full" onclick="closeModal()">إلغاء</button>
      `;
      document.getElementById('modal').style.display = 'flex';
    };

    window.saveProfileChanges = async () => {
      const newName = document.getElementById('edit-name').value.trim();
      let newUsername = document.getElementById('edit-username').value.trim().replace('@', '');
      const newBio = document.getElementById('edit-bio').value.trim();

      if (newUsername.length < 2) {
        alert('يجب أن يكون اسم المستخدم من حرفين أو أكثر!');
        return;
      }

      update(ref(db, 'users/' + currentUser.uid), {
        name: newName, username: newUsername, bio: newBio
      }).then(() => { closeModal(); renderProfile(currentUser.uid); });
    };

    function renderSearch() {
      const box = document.getElementById('content-box');
      box.innerHTML = `
        <input type="text" class="form-input" placeholder="ابحث باسم المستخدم..." oninput="executeSearch(this.value)">
        <div id="search-results" style="margin-top:10px;"></div>
      `;
    }

    window.executeSearch = (val) => {
      const res = document.getElementById('search-results');
      if (!val.trim()) { res.innerHTML = ''; return; }
      val = val.toLowerCase().replace('@', '');
      onValue(ref(db, 'users'), (snapshot) => {
        res.innerHTML = '';
        snapshot.forEach((child) => {
          const u = child.val();
          if (u.username?.toLowerCase().includes(val) || u.name?.toLowerCase().includes(val)) {
            res.innerHTML += `
              <div class="user-item">
                <div><b>${u.name}</b> <small>@${u.username}</small></div>
                <button class="btn-send" onclick="renderProfile('${child.key}')">عرض</button>
              </div>
            `;
          }
        });
      }, { onlyOnce: true });
    };

    window.openLightbox = (src) => {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    };
    window.closeLightbox = () => document.getElementById('lightbox').style.display = 'none';

    window.toggleVerify = (uid, status) => { update(ref(db, 'users/' + uid), { verified: status }); };
    window.setRole = (uid, role) => { update(ref(db, 'users/' + uid), { role: role }); };
    window.closeModal = () => document.getElementById('modal').style.display = 'none';
  </script>
</head>
<body>

  <div class="app-container">
    <!-- الهيدر الرئيسي -->
    <div class="header">
      <span id="user-header-info" style="font-weight:bold;font-size:14px;">Chatity App</span>
      <div class="header-tools">
        <button class="tool-icon-btn" onclick="openNotifications()">
          🔔 <span id="notif-badge" class="notif-badge" style="display:none;">0</span>
        </button>
        <button id="btn-shield" class="tool-icon-btn" style="display:none;" onclick="switchTab('shield')">🛡️</button>
        <button id="btn-support-admin" class="tool-icon-btn" style="display:none;" onclick="switchTab('support_admin')">⚙️</button>
        <button class="tool-icon-btn" onclick="logout()">🚪</button>
      </div>
    </div>

    <!-- هيدر المجموعة (يظهر عند المراسلة بالجروبات) -->
    <div id="group-header" class="group-header" style="display:none;">
      <div class="group-info-btn" onclick="openGroupSettings()">
        <img id="group-header-img" src="https://via.placeholder.com/36" class="group-avatar">
        <b id="group-title-name">اسم الكروب</b>
      </div>
      <button class="tool-icon-btn" onclick="switchTab('inbox')">⬅️ رجوع</button>
    </div>

    <!-- أزرار القائمة الجانبية/التنقل -->
    <div id="nav-tabs" class="nav-tabs">
      <button id="tab-public" class="tab-btn active" onclick="switchTab('public')">الخادم العام</button>
      <button id="tab-inbox" class="tab-btn" onclick="switchTab('inbox')">المحادثات</button>
      <button id="tab-reels" class="tab-btn" onclick="switchTab('reels')">الريلز 🎬</button>
      <button id="tab-search" class="tab-btn" onclick="switchTab('search')">بحث 🔍</button>
      <button id="tab-support" class="tab-btn" onclick="switchTab('support')">الدعم 🛠️</button>
      <button id="tab-profile" class="tab-btn" onclick="switchTab('profile')">بروفايلي</button>
    </div>

    <!-- منطقة المحتوى وعرض الرسائل -->
    <div id="content-box" class="content-area"></div>

    <!-- صندوق الرد والمعاينة -->
    <div id="reply-preview-box" style="display:none;background:#e1f5fe;padding:6px;font-size:12px;border-right:3px solid #0288d1;margin:0 8px;"></div>

    <!-- شريط إرسال الرسائل والميديا -->
    <div id="input-area" class="input-area">
      <input type="file" id="img-input" accept="image/*" style="display:none;" onchange="uploadImage(event)">
      <button class="icon-btn" onclick="document.getElementById('img-input').click()">📷</button>
      
      <!-- زر إرسال فيديو للشات -->
      <input type="file" id="video-input" accept="video/*" style="display:none;" onchange="uploadVideoMsg(event)">
      <button class="icon-btn" onclick="document.getElementById('video-input').click()">🎥</button>

      <button id="btn-voice" class="icon-btn" onclick="toggleVoiceRecording()">🎤</button>
      <input type="text" id="msg-input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="btn-send" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <!-- شاشة التسجيل -->
  <div id="login-screen" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;gap:15px;background:#fff;position:fixed;inset:0;z-index:999;">
    <h2>Chatity Super App</h2>
    <button onclick="loginWithGoogle()" style="padding:10px 20px;background:#4285f4;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">دخول بواسطة Google</button>
  </div>

  <!-- شاشة إعداد الحساب -->
  <div id="setup-profile-screen" style="display:none;flex-direction:column;justify-content:center;align-items:center;height:100vh;padding:20px;background:#fff;position:fixed;inset:0;z-index:999;">
    <h3>إكمال بيانات الحساب 👤</h3>
    <input type="text" id="setup-name" class="form-input" placeholder="الاسم الظاهر">
    <input type="text" id="setup-username" class="form-input" placeholder="اسم المستخدم (Username)">
    <button class="btn-full" style="background:var(--primary);color:#fff;" onclick="completeProfileSetup()">دخول التطبيق 🚀</button>
  </div>

  <!-- النافذة المنبثقة (Modal) -->
  <div id="modal" class="modal">
    <div id="modal-content" class="modal-body"></div>
  </div>

  <!-- العرض المكبر للصور (Lightbox) -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="">
  </div>

</body>
</html>
